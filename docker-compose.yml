version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Run benchmark as a separate service
  benchmark:
    build: .
    command: python -m evaluation.benchmark
    env_file:
      - .env
    volumes:
      - ./cache:/app/cache
    depends_on:
      - app
    profiles:
      - benchmark