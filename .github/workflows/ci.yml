name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --config-file mypy.ini agents/ core/ api/ synthetic_data/ evaluation/ main.py
      - name: JavaScript syntax check
        run: node --check frontend/shared.js && node --check frontend/app.js && node --check frontend/dev.js
      - name: Pytest
        run: pytest tests/ -q
      - name: Route smoke test
        run: |
          ENABLE_LLM_NARRATIVES=false python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/ | grep -q 'Order Analysis'
          curl -sf http://127.0.0.1:8000/dev | grep -q 'Developer Tools'
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/api/v1/test-cases | grep -q 'CUST_GOOD_01'
          kill $SERVER_PID
